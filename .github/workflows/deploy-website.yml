name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'config/web-model.json'
      - 'docs/ocr-model-notice.txt'
      - 'src-tauri/resources/models/**'
      - 'src-tauri/resources/figure-detection/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Install website dependencies
        run: npm ci --prefix website
      - name: Fetch verified OCR model and build app with documentation
        run: npm run build:website
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
